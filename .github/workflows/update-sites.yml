name: Update sites

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        site:
          - adams-and-moore
          - housing-ai-site-update
          - ivygrove
          - workplatform-ecomm

    env:
      SITE: ${{ matrix.site }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: alt-design/${{ matrix.site }}
          token: ${{ secrets.SITES_TOKEN }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Update the receiver
        run: |
          locked() { jq -r '.packages[] | select(.name == "alt-design/altimiser-statamic") | .version' composer.lock; }
          echo "BEFORE=$(locked)" >> "$GITHUB_ENV"
          composer update alt-design/altimiser-statamic --no-install --no-scripts --no-plugins --no-interaction
          echo "AFTER=$(locked)" >> "$GITHUB_ENV"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "$SITE: left alone on $AFTER, the newest release its constraint allows." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "altimiser-statamic-$AFTER"
          git commit -qam "Update the Altimiser receiver to $AFTER"
          git push -q -u origin "altimiser-statamic-$AFTER"

          cat > /tmp/body.md <<EOF
          Updates the Altimiser receiver from $BEFORE to [$AFTER](https://github.com/alt-design/altimiser-statamic/releases/tag/$AFTER). Opened by the receiver's Update sites workflow.

          **Testing:** the lock file changes only the receiver's entry, and the plugin-api-version line where the runner's Composer is newer.
          **Risk:** read the release notes for anything to change by hand, such as a key in a published config/altimiser.php or a reconnect from Altimiser after it deploys.
          **How to revert:** revert the merge commit.
          EOF

          url=$(gh pr create --title "Update the Altimiser receiver to $AFTER" --body-file /tmp/body.md)
          echo "$SITE: $url" >> "$GITHUB_STEP_SUMMARY"
