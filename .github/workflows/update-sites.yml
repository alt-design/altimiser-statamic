name: Update sites

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to roll out, such as v0.9.1
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        site:
          - adams-and-moore
          - housing-ai-site-update
          - ivygrove
          - workplatform-ecomm

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SITE: ${{ matrix.site }}
      GH_TOKEN: ${{ secrets.SITES_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: alt-design/${{ matrix.site }}
          token: ${{ secrets.SITES_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Update the receiver
        run: composer update alt-design/altimiser-statamic --no-install --no-scripts --no-plugins --no-interaction

      - name: Open a pull request
        run: |
          if git diff --quiet composer.lock; then
            echo "$SITE: left alone, its constraint does not allow $TAG or it already has it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "altimiser-statamic-$TAG"
          git commit -qam "Update the Altimiser receiver to $TAG"
          git push -q -u origin "altimiser-statamic-$TAG"

          cat > /tmp/body.md <<EOF
          Updates the Altimiser receiver to [$TAG](https://github.com/alt-design/altimiser-statamic/releases/tag/$TAG). Opened by the receiver's Update sites workflow.

          **Testing:** the lock file changes only the receiver.
          **Risk:** read the release notes for anything to change by hand, such as a key in a published config/altimiser.php or a reconnect from Altimiser after it deploys.
          **How to revert:** revert the merge commit.
          EOF

          url=$(gh pr create --title "Update the Altimiser receiver to $TAG" --body-file /tmp/body.md)
          echo "$SITE: $url" >> "$GITHUB_STEP_SUMMARY"
