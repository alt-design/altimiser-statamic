# The agent's steps for a site whose altimiser.yml calls this, so the model, the
# agent and its flags change here once rather than in every site's repository.
# Nothing is committed: the diff goes back to Altimiser as an artifact, to be
# reviewed and applied through the addon.
name: Altimiser agent (Claude)

on:
  workflow_call:
    inputs:
      brief:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Statamic's git automation commits form submissions and user accounts,
      # and anything the agent reads goes to the model. A template fix never
      # needs either, so they are left out of the checkout altogether, as is
      # the token git would otherwise keep in .git/config for the agent to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/storage/
            !/users/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the agent
        run: npm install -g @anthropic-ai/claude-code

      - name: Look at the findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF: ${{ inputs.brief }}
        run: |
          claude --print "$BRIEF" \
            --output-format json \
            --model claude-opus-5 \
            --permission-mode acceptEdits \
            --allowedTools Read Grep Glob Edit Write \
            --disallowedTools Bash WebFetch WebSearch Task \
            --mcp-config '{"mcpServers":{}}' \
            --strict-mcp-config \
            > /tmp/agent.json

      - name: Take the diff
        run: |
          git add -A
          git diff --cached > /tmp/altimiser.patch
          jq -r '.structured_result // .result // "{}"' /tmp/agent.json > /tmp/altimiser.json

      - uses: actions/upload-artifact@v4
        with:
          name: altimiser
          path: |
            /tmp/altimiser.patch
            /tmp/altimiser.json
          retention-days: 3
